name: Build & Release Decky Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Automated Test Suites
        env:
          PYTHONPATH: .
        run: pnpm test

      - name: Build Plugin Bundle
        run: pnpm run build

      - name: Create Plugin Zip Package
        run: |
          mkdir -p build_stage/next-unlock
          cp -r dist backend main.py plugin.json package.json README.md pyproject.toml build_stage/next-unlock/
          cd build_stage
          zip -r ../next-unlock.zip next-unlock

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-unlock-zip
          path: next-unlock.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: next-unlock.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
